<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CalcStack</title>

    <style>

        body{
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        h1{
            color: #00bfff;
            font-size: 40px;
        }

        h2{
            margin-bottom: 30px;
        }

        form{
            margin: 10px;
        }

        input,
        select,
        button{
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
        }

        input,
        select{
            background-color: #1f1f1f;
            color: white;
        }

        button{
            background: linear-gradient(90deg, #00bfff, #007bff);
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover{
            transform: scale(1.05);
        }

        hr{
            width: 60%;
            margin-top: 30px;
            border: 1px solid #333;
        }

        p{
            background-color: #1e1e1e;
            width: fit-content;
            margin: auto;
            padding: 10px 20px;
            border-radius: 10px;
        }

    </style>

</head>
<body>

    <h1>CalcStack</h1>
    <h2>Resultado actual: {{ data.result }}</h2>

    <form action="/operate" method="POST">
        <input type="number" step="any" name="number" required>

        <select name="operator">
            <option value="+">Sumar</option>
            <option value="-">Restar</option>
            <option value="*">Multiplicar</option>
            <option value="/">Dividir</option>
        </select>

        <button type="submit">Calcular</button>
    </form>

    <br>
    <form action="/undo" method="POST">
        <button type="submit">Undo</button>
    </form>

    <form action="/redo" method="POST">
        <button type="submit">Redo</button>
    </form>

    <form action="/clear" method="POST">
        <button type="submit">Limpiar</button>
    </form>


    <hr>

    <h3>Undo Stack</h3>
    <p>{{ data.undo_stack }}</p>

    <h3>Redo Stack</h3>
    <p>{{ data.redo_stack }}</p>

</body>
</html>
